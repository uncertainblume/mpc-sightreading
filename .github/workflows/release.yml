# Publishes a GitHub release for every version in CHANGELOG.md that has none yet: tag vX.Y.Z on
# the last commit that built dist/sight-reader-X.Y.Z-mpc.zip, the zip attached (and the MIDI
# loader's dist/mpc-sightreading-midi-loader-X.Y.Z.zip when that commit has one), and that
# version's CHANGELOG section as the notes. The highest version is marked Latest. Releases that
# exist already get their notes refreshed from CHANGELOG.md, so corrections there reach them.
#
# Runs on every push to main (a release is published by merging its CHANGELOG section and its
# zip), on a pushed v* tag, and by hand (Actions -> Release -> Run workflow).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish new versions and refresh the notes of the others
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSIONS="$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ' | sort -V)"
          [ -n "$VERSIONS" ] || { echo "no versions in CHANGELOG.md"; exit 0; }
          HIGHEST="$(printf '%s\n' $VERSIONS | tail -n 1)"
          notes() {
            awk -v v="$1" '
              index($0, "## [" v "]") == 1 { on = 1; next }
              on && (/^## \[/ || /^\[[0-9]/) { exit }
              on { print }
            ' CHANGELOG.md > notes.md
            {
              echo
              echo "### Install"
              echo
              echo "Needs MPC OS 3.10.1 or later with Preferences > Enhancements (Beta) > Enable Enhancements and External Plugin Support on."
              echo "Unzip \`sight-reader-$1-mpc.zip\` and copy the folder \`Practice Tools - VST - Sight Reader\` into \`VST2 Plugins\` at the top of the MPC's internal drive, then restart the MPC app."
              echo "Projects that already use Sight Reader keep their settings. See the [README](https://github.com/${GITHUB_REPOSITORY}/blob/v$1/README.md)."
            } >> notes.md
          }
          for VER in $VERSIONS; do
            TAG="v$VER"
            notes "$VER"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --notes-file notes.md >/dev/null && echo "$TAG: released already, notes refreshed"
              continue
            fi
            ZIP="dist/sight-reader-$VER-mpc.zip"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              REF="$(git rev-list -n 1 "$TAG")"
            else
              REF="$(git log -1 --diff-filter=AM --format=%H -- "$ZIP" || true)"
              # The workflow's token may not create a tag on a commit whose workflow files differ
              # from this one's (GitHub answers 403). If this commit still carries the same zip,
              # tag this commit instead.
              if [ -n "$REF" ] && ! git diff --quiet "$REF" HEAD -- .github/workflows \
                 && [ "$(git rev-parse "$REF:$ZIP")" = "$(git rev-parse "HEAD:$ZIP" 2>/dev/null || echo none)" ]; then
                REF="$(git rev-parse HEAD)"
              fi
            fi
            if [ -z "$REF" ] || ! git cat-file -e "$REF:$ZIP" 2>/dev/null; then echo "$TAG: no $ZIP in history, skipped"; continue; fi
            git show "$REF:$ZIP" > "sight-reader-$VER-mpc.zip"
            set -- "sight-reader-$VER-mpc.zip"
            LOADER="dist/mpc-sightreading-midi-loader-$VER.zip"
            if git cat-file -e "$REF:$LOADER" 2>/dev/null; then
              git show "$REF:$LOADER" > "mpc-sightreading-midi-loader-$VER.zip"
              set -- "$@" "mpc-sightreading-midi-loader-$VER.zip"
            fi
            LATEST=false; [ "$VER" = "$HIGHEST" ] && LATEST=true
            echo "$TAG: releasing $REF (latest: $LATEST): $*"
            gh release create "$TAG" "$@" --target "$REF" \
              --title "Sight Reader $VER" --notes-file notes.md --latest="$LATEST"
          done
